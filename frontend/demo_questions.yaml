# Demo question set — checked by hand against the brochure PDFs (not OCR output).
# Page numbers are one-based, per PDF file.
#
# type:
#   known_answer  — answer is stated directly in the brochure
#   paraphrase    — same fact, asked in different words (tests semantic retrieval)
#   missing_info  — brochure does not say; bot must set insufficient_evidence: true
#   isolation     — fact exists only in ANOTHER company's brochure; bot must not use it
#
# expected_points: what a correct answer must contain (grade on these, not exact wording)

questions:

  # ---------------- Barndoor.ai ----------------
  - id: barndoor_01
    company_id: barndoor_ai
    type: known_answer
    question: What are the six things the Barndoor AI gateway enforces on every call?
    expected_points:
      - Human & agent access (RBAC by role, group, tool, action; dedicated identity per agent)
      - Runtime policy (allow, deny, or require approval per tool call, enforced inline)
      - AI-ready DLP (PII and secrets masked or blocked before reaching a model or MCP server)
      - Routing & fallback (frontier and self-hosted models, routed to most cost-effective)
      - Usage & cost control (real-time spend, hard caps by user, team, agent, model)
      - Observability & audit (every action and policy, streamed to Splunk or Datadog)
    sources:
      - {source_file: 4_Barndoor.pdf, page: 2}

  - id: barndoor_02
    company_id: barndoor_ai
    type: paraphrase
    question: How does Barndoor keep sensitive data like PII away from the models?
    expected_points:
      - AI-ready DLP masks or blocks PII and secrets before they reach a model or MCP server
    sources:
      - {source_file: 4_Barndoor.pdf, page: 2}

  - id: barndoor_03
    company_id: barndoor_ai
    type: known_answer
    question: Where can Barndoor be deployed?
    expected_points:
      - SaaS (fully managed)
      - Private cloud (in your VPC)
      - On prem (data residency)
    sources:
      - {source_file: 4_Barndoor.pdf, page: 1}

  - id: barndoor_04
    company_id: barndoor_ai
    type: known_answer
    question: How many MCP servers and AI models does Barndoor support, and what certification does it have?
    expected_points:
      - 100+ MCP servers plus custom
      - 100+ AI models plus self-hosted
      - SOC 2 Type II certified
    sources:
      - {source_file: 4_Barndoor.pdf, page: 2}

  - id: barndoor_05
    company_id: barndoor_ai
    type: missing_info
    question: How much does Barndoor cost per user?
    expected_points:
      - Brochure does not provide pricing; insufficient_evidence is true
    sources: []

  # ---------------- C1.ai ----------------
  - id: c1_01
    company_id: c1_ai
    type: known_answer
    question: What does C1.ai do?
    expected_points:
      - Identity platform for the AI era
      - Governs identity, access, and agent work for people, service accounts, and AI agents
    sources:
      - {source_file: 6_C1ai.pdf, page: 1}
      - {source_file: 6_C1ai.pdf, page: 2}

  - id: c1_02
    company_id: c1_ai
    type: known_answer
    question: How many connectors and MCP servers does C1 have?
    expected_points:
      - 400+ C1 Connectors, built on Baton (open-source connector framework)
      - 3,000+ C1 MCP Servers
    sources:
      - {source_file: 6_C1ai.pdf, page: 2}

  - id: c1_03
    company_id: c1_ai
    type: paraphrase
    question: Can engineers manage C1 access policies as code?
    expected_points:
      - Yes — REST API and SDKs, C1.ai CLI, Terraform, and Functions
      - Access policy lives in code, so changes are reviewed, versioned, repeatable
    sources:
      - {source_file: 6_C1ai.pdf, page: 1}

  - id: c1_04
    company_id: c1_ai
    type: known_answer
    question: What percentage of organizations had an identity-related breach according to C1?
    expected_points:
      - 80% experienced at least one identity-related breach in the past year
    sources:
      - {source_file: 6_C1ai.pdf, page: 1}

  - id: c1_05
    company_id: c1_ai
    type: known_answer
    question: What are the four parts of the C1 product suite?
    expected_points:
      - Govern (identity)
      - Run (secure agents)
      - Work (put AI to work)
      - Platform
    sources:
      - {source_file: 6_C1ai.pdf, page: 2}

