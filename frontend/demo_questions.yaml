  # ---------------- Isolation checks ----------------
  # Each fact below exists ONLY in another company's brochure.
  - id: iso_01
    company_id: promptql
    type: isolation
    question: Is PromptQL SOC 2 Type II certified?
    expected_points:
      - insufficient_evidence is true (SOC 2 Type II appears only in Barndoor's brochure)
    sources: []

  - id: iso_02
    company_id: merge
    type: isolation
    question: How many MCP servers does Merge support?
    expected_points:
      - insufficient_evidence is true; must NOT say 100+ (Barndoor) or 3,000+ (C1)
    sources: []

  - id: iso_03
    company_id: barndoor_ai
    type: isolation
    question: Does Barndoor offer an Agent Studio for business teams?
    expected_points:
      - insufficient_evidence is true; Agent Studio is a Halo product
    sources: []
